name: Windows release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content Kutu.csproj
          $version = $project.Project.PropertyGroup.Version
          if ("v$version" -ne '${{ github.ref_name }}') { throw "Project version $version does not match tag" }
      - name: Run tests
        shell: pwsh
        run: |
          dotnet run --project tests/Kutu.IntegrationTests/Kutu.IntegrationTests.csproj
          node tests/web-filter.test.js
      - name: Publish app
        shell: pwsh
        run: |
          ./scripts/publish.ps1
          Copy-Item publish/win-x64/Kutu.exe Kutu-win-x64.exe
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create '${{ github.ref_name }}' Kutu-win-x64.exe --title '${{ github.ref_name }}' --generate-notes
